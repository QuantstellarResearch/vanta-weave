    "numba>=0.65.1",
    "numpy>=2.4.4",
    "pandapower>=3.1.2",
    "pandas==2.2.3",
    "pennylane>=0.45.0",
    "pyomo>=6.10.0",
    "qiskit>=2.4.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "simbench>=1.6.1",
    "vanta-lattice",
